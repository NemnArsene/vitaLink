global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'vitalink-gateway'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['gateway:9090']
        labels:
          service: 'vitalink-gateway'
          environment: 'development'

  - job_name: 'vitalink-prometheus'
    static_configs:
      - targets: ['localhost:9090']
